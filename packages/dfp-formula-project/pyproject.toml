[project]
name = "dfp-formula-project"
version = "0.1.0"
description = "DFP quasi-Newton optimizer with a Qt GUI and 3D surface plots"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "py-expression-eval>=0.3.14",
    "scipy>=1.18",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dfp_formula_project"
