[project]
name = "pure-alexnet"
version = "0.1.0"
description = "AlexNet implementation on tflearn"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "tensorflow>=2.16",
    "tflearn>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pure_alexnet"
