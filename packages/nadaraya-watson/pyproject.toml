[project]
name = "nadaraya-watson"
version = "0.1.0"
description = "Nadaraya-Watson kernel regression demo"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nadaraya_watson"
