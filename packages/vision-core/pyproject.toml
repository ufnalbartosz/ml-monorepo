[project]
name = "vision-core"
version = "0.1.0"
description = "Shared data, caching, training and metrics helpers for the image-classification packages"
requires-python = ">=3.12"
dependencies = [
    "keras>=3.5",
    "numpy>=2.5.1",
    "pillow>=11.0",
    "tensorboard>=2.16",
    "tensorflow>=2.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vision_core"
