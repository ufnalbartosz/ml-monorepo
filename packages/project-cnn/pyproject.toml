[project]
name = "project-cnn"
version = "0.1.0"
description = "Inception-style CNN for CIFAR-100 classification"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "scikit-learn>=1.5",
    "tensorflow>=2.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "project_cnn"
