[project]
name = "idv-risk"
version = "0.1.0"
description = "XGBoost risk-fusion engine for identity verification fraud decisions"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "joblib>=1.4",
    "scikit-learn>=1.6",
    "xgboost>=3.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "idv_risk"
